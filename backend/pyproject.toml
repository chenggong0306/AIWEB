[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "deepseek-harness-sdk>=0.1.5rc1",
    "fastapi>=0.143.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
